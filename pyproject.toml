[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vih-sida-hpc"
version = "1.0.0"
authors = [
  { name="Groupe 5 (ENSGMM / UNSTIM)", email="contact@ensgmm.unstim.bj" },
]
description = "Simulation mathématique et résolution numérique haute performance (BLAS/LAPACK/MKL) des dynamiques d'infection par le VIH-SIDA"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "threadpoolctl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
